# Local development override: publishes infrastructure ports on 127.0.0.1 so services can run
# on the host with `pnpm dev`. Never use this file on a shared or production host.
#
#   docker compose -f compose.yaml -f compose.dev.yaml up -d --build
#
# Internal networks cannot publish ports, so the published containers additionally join the
# `dev-host` bridge network.

services:
  postgres:
    networks: [data, dev-host]
    ports: ['127.0.0.1:5432:5432']
  redis:
    networks: [data, dev-host]
    ports: ['127.0.0.1:6379:6379']
  rabbitmq:
    networks: [data, observability, dev-host]
    ports:
      - '127.0.0.1:5672:5672'
      - '127.0.0.1:15672:15672'
  opensearch:
    networks: [data, dev-host]
    ports: ['127.0.0.1:9200:9200']
  minio:
    networks: [data, observability, dev-host]
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
  keycloak:
    networks: [frontend, backend, data, observability, dev-host]
    ports: ['127.0.0.1:8180:8180']
    environment:
      KC_HOSTNAME: http://localhost:8180/auth
      # `pnpm dev` serves the web app on :3000. The cve-web client accepts it in addition to
      # PUBLIC_ORIGIN, so the same Keycloak volume also works for the full stack behind Nginx.
      KEYCLOAK_WEB_DEV_ORIGIN: http://localhost:3000
  clamav:
    networks: [scanning, egress, dev-host]
    ports: ['127.0.0.1:3310:3310']
  prometheus:
    networks: [observability, dev-host]
    ports: ['127.0.0.1:9090:9090']

networks:
  dev-host:
