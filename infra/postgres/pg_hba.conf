# TYPE  DATABASE  USER  ADDRESS  METHOD
# Local socket inside the container (init scripts, health checks).
local   all       all            scram-sha-256
# Every TCP client must authenticate with SCRAM; roles can only connect to databases they
# have CONNECT on (PUBLIC was revoked for every service database).
host    all       all   0.0.0.0/0  scram-sha-256
host    all       all   ::/0       scram-sha-256
