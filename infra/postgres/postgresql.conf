# PostgreSQL settings for the platform container (1 GiB memory limit).
listen_addresses = '*'
max_connections = 200
shared_buffers = 256MB
effective_cache_size = 640MB
work_mem = 4MB
maintenance_work_mem = 64MB

# Passwords are stored and verified with SCRAM only.
password_encryption = scram-sha-256

# Durability.
wal_level = replica
max_wal_size = 1GB
checkpoint_timeout = 10min

# Logging: connections, slow statements and lock waits, all in UTC.
log_timezone = 'UTC'
timezone = 'UTC'
log_connections = on
log_disconnections = on
log_min_duration_statement = 1000
log_lock_waits = on
log_line_prefix = '%m [%p] %q%u@%d '

# Statistics used by postgres-exporter.
track_io_timing = on
