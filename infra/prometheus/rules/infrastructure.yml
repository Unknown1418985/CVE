groups:
  - name: availability
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.job }} target {{ $labels.instance }} is down'

  - name: messaging
    rules:
      - alert: RabbitMqDeadLetterMessages
        expr: sum by (queue) (rabbitmq_detailed_queue_messages{queue=~".*\\.dlq"}) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Dead-letter queue {{ $labels.queue }} contains messages'
      - alert: RabbitMqQueueBacklog
        expr: sum by (queue) (rabbitmq_detailed_queue_messages_ready{queue!~".*\\.(dlq|retry\\.\\d+)"}) > 10000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Queue {{ $labels.queue }} has a backlog of {{ $value }} messages'
      - alert: RabbitMqResourceAlarm
        expr: max(rabbitmq_alarms_memory_used_watermark) > 0 or max(rabbitmq_alarms_free_disk_space_watermark) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'RabbitMQ raised a memory or disk alarm and is blocking publishers'

  - name: datastores
    rules:
      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Redis uses {{ $value | humanizePercentage }} of maxmemory (noeviction: writes will fail when full)'
      - alert: PostgresConnectionsHigh
        expr: sum(pg_stat_activity_count) / max(pg_settings_max_connections) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'PostgreSQL uses {{ $value | humanizePercentage }} of max_connections'

  - name: services
    rules:
      - alert: ServiceHighErrorRate
        expr: >-
          sum by (service) (rate(http_server_request_duration_seconds_count{status_code=~"5.."}[5m]))
          / sum by (service) (rate(http_server_request_duration_seconds_count[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.service }} returns 5xx for {{ $value | humanizePercentage }} of requests'
