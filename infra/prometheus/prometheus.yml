# Prometheus scrape configuration. Every target is reached over the internal `observability`
# network; nothing here is exposed publicly. Targets that are not running (for example the
# application containers when only infrastructure is up) are reported as down, never hidden.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: cve-platform

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: rabbitmq
    static_configs:
      - targets: ['rabbitmq:15692']

  - job_name: rabbitmq-queues
    metrics_path: /metrics/detailed
    params:
      vhost: [cve]
      family: [queue_coarse_metrics, queue_consumer_count]
    static_configs:
      - targets: ['rabbitmq:15692']

  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ['minio:9000']

  - job_name: keycloak
    metrics_path: /auth/metrics
    static_configs:
      - targets: ['keycloak:9000']

  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: nginx
    static_configs:
      - targets: ['nginx-exporter:9113']

  # Application services expose /metrics on port 9464 (METRICS_PORT).
  - job_name: services
    static_configs:
      - targets:
          - api-gateway:9464
          - identity-service:9464
          - cve-service:9464
          - intelligence-service:9464
          - asset-service:9464
          - poc-service:9464
          - download-service:9464
          - exploit-service:9464
          - reporting-service:9464
          - notification-service:9464
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+):\d+'
        target_label: instance
        replacement: '$1'
