# Redis configuration for the CVE platform (queues, cache, idempotency keys).
# Authentication is ACL-only: the ACL file is generated at container start by entrypoint.sh
# from the per-service passwords in `.env`; the `default` user is disabled.

bind 0.0.0.0
port 6379
protected-mode yes
dir /data

# BullMQ requires that keys are never evicted.
maxmemory 384mb
maxmemory-policy noeviction

# Durability: append-only file with one fsync per second plus periodic snapshots.
appendonly yes
appendfsync everysec
save 900 1 300 100 60 10000

# Avoid long blocking operations on the event loop.
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# Bound memory used by misbehaving clients.
client-output-buffer-limit pubsub 32mb 8mb 60
timeout 0
tcp-keepalive 60

loglevel notice
