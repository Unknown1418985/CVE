# Alertmanager routing. Every alert goes to one webhook receiver whose URL is read from a file
# that the container writes from ALERTMANAGER_WEBHOOK_URL at start (compose.yaml), so the URL
# (which usually embeds a token) never lands in this repository.
#
# To use e-mail, Slack, PagerDuty or Opsgenie instead, replace the receiver below; see
# docs/monitoring.md. Delivery failures raise AlertNotificationsFailing.
route:
  receiver: platform-webhook
  group_by: [alertname, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="critical"']
      receiver: platform-webhook
      group_wait: 10s
      repeat_interval: 1h
    - matchers: ['severity="info"']
      receiver: platform-webhook
      repeat_interval: 24h

receivers:
  - name: platform-webhook
    webhook_configs:
      - url_file: /tmp/alertmanager/webhook-url
        send_resolved: true
        max_alerts: 50

inhibit_rules:
  # A service that is not ready also has failing dependencies; page once.
  - source_matchers: ['alertname="ServiceNotReady"']
    target_matchers: ['alertname=~"ServiceDependencyDown|ServiceDependencyDegraded"']
    equal: [service]
