# Mounted as /etc/rabbitmq/conf.d/20-cve-platform.conf (loaded after the image defaults).
# Users, the `cve` vhost, permissions and the events exchange are created by the
# infra-provisioner (tools/infra-provisioner), not by this file.

# The guest user may only connect from localhost (it is not created when a default user is set).
loopback_users.guest = true

listeners.tcp.default = 5672
management.tcp.port = 15672
prometheus.tcp.port = 15692

# Structured logs on stdout.
log.console = true
log.console.level = info
log.console.formatter = json

# Resource alarms sized for the container memory limit in compose.yaml.
vm_memory_high_watermark.absolute = 640MiB
disk_free_limit.absolute = 1GB

# Reject publishes and consumes of messages larger than 16 MiB (events are small JSON documents).
max_message_size = 16777216

# Detect dead TCP peers.
heartbeat = 30

# Expose per-object metrics (queue depth per queue) on /metrics/per-object for alerting.
prometheus.return_per_object_metrics = false
