# OpenSearch node configuration (single node). Mounted read-only.
# TLS material is generated by init-security.sh into the `opensearch-certs` volume; the demo
# security configuration that ships with the image is disabled (DISABLE_INSTALL_DEMO_CONFIG).

cluster.name: cve-platform
node.name: opensearch
network.host: 0.0.0.0
bootstrap.memory_lock: true

# Refuse to auto-create indices so every index is created deliberately (with its mapping)
# by the owning service.
action.auto_create_index: false
action.destructive_requires_name: true

# ---- TLS (node-to-node and HTTP)
plugins.security.ssl.transport.keystore_type: PKCS12
plugins.security.ssl.transport.keystore_filepath: certs/node.p12
plugins.security.ssl.transport.keystore_password: ${OPENSEARCH_KEYSTORE_PASSWORD}
plugins.security.ssl.transport.truststore_type: PKCS12
plugins.security.ssl.transport.truststore_filepath: certs/truststore.p12
plugins.security.ssl.transport.truststore_password: ${OPENSEARCH_KEYSTORE_PASSWORD}
plugins.security.ssl.transport.enforce_hostname_verification: false

plugins.security.ssl.http.enabled: true
plugins.security.ssl.http.keystore_type: PKCS12
plugins.security.ssl.http.keystore_filepath: certs/node.p12
plugins.security.ssl.http.keystore_password: ${OPENSEARCH_KEYSTORE_PASSWORD}
plugins.security.ssl.http.truststore_type: PKCS12
plugins.security.ssl.http.truststore_filepath: certs/truststore.p12
plugins.security.ssl.http.truststore_password: ${OPENSEARCH_KEYSTORE_PASSWORD}

# ---- Security plugin
plugins.security.nodes_dn:
  - 'CN=opensearch,OU=CVE Platform,O=CVE Platform'
# Initialise the security index from config/opensearch-security on first start.
plugins.security.allow_default_init_securityindex: true
plugins.security.restapi.roles_enabled: ['all_access', 'security_rest_api_access']
plugins.security.audit.type: internal_opensearch
plugins.security.enable_snapshot_restore_privilege: true
plugins.security.check_snapshot_restore_write_privileges: true
plugins.security.system_indices.enabled: true
plugins.security.system_indices.indices:
  - '.opendistro-alerting-config'
  - '.opendistro-alerting-alert*'
  - '.opendistro-anomaly-results*'
  - '.opendistro-anomaly-detector*'
  - '.opendistro-reports-*'
  - '.opensearch-notifications-*'
  - '.opensearch-notebooks'
  - '.opendistro-asynchronous-search-response*'
  - '.replication-metadata-store'
