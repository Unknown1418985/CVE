# Production entry point (compose.prod.yaml): terminates TLS for the web frontend, the API Gateway
# and Keycloak, and redirects plain HTTP to HTTPS. Runs unprivileged (uid 101) with a read-only root
# filesystem, so it listens on 8080/8443 inside the container; compose publishes them as 80/443.
#
# Certificates are mounted read-only at /etc/nginx/tls (fullchain.pem, privkey.pem); see
# docs/deployment.md for issuing and renewing them (ACME webroot at /var/www/acme). The host name
# comes from PUBLIC_HOSTNAME via templates/server-name.conf.template (rendered to /tmp).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  log_format json escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
    '"request_id":"$request_id","method":"$request_method","uri":"$uri","status":$status,'
    '"bytes_sent":$body_bytes_sent,"request_time":$request_time,'
    '"upstream":"$upstream_addr","upstream_time":"$upstream_response_time",'
    '"user_agent":"$http_user_agent"}';
  access_log /dev/stdout json;

  server_tokens off;
  sendfile on;
  keepalive_timeout 30s;
  client_max_body_size 1m;
  client_body_timeout 15s;
  client_header_timeout 15s;
  send_timeout 30s;
  proxy_connect_timeout 5s;
  proxy_read_timeout 60s;
  proxy_send_timeout 60s;

  # Per-IP limits in front of the gateway's own application-level rate limiting.
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
  limit_conn_zone $binary_remote_addr zone=perip:10m;
  limit_req_status 429;
  limit_conn_status 429;

  # Port clients connected to (forwarded to Keycloak and the web app).
  map $server_port $public_port {
    8443 443;
    8080 80;
    default $server_port;
  }

  # Propagate an existing correlation ID or use Nginx's request ID.
  map $http_x_correlation_id $correlation_id {
    default $http_x_correlation_id;
    '' $request_id;
  }

  upstream web {
    server web:3000;
    keepalive 16;
  }

  upstream api_gateway {
    server api-gateway:4000;
    keepalive 16;
  }

  upstream keycloak {
    server keycloak:8180;
    keepalive 8;
  }

  # Requests for any other host name are dropped (no certificate is presented over TLS).
  server {
    listen 8080 default_server;
    server_name _;
    return 444;
  }

  server {
    listen 8443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
  }

  # Plain HTTP for the platform host: ACME HTTP-01 challenges and a permanent redirect only.
  server {
    listen 8080;
    include /tmp/server-name.conf;

    location ^~ /.well-known/acme-challenge/ {
      root /var/www/acme;
      default_type text/plain;
    }

    location / {
      return 301 https://$server_name$request_uri;
    }
  }

  server {
    listen 8443 ssl;
    http2 on;
    include /tmp/server-name.conf;

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    # Mozilla "intermediate" profile: TLS 1.2 and 1.3 with forward-secret AEAD ciphers only.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Two years, all subdomains. Only sent over HTTPS. Add "preload" once the whole domain is
    # HTTPS-only and you intend to submit it to the browser preload list.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    include /etc/nginx/platform/snippets/platform.conf;
  }

  # Internal listener for health checks and the Prometheus exporter. Not published.
  server {
    listen 8081;
    access_log off;

    location = /healthz {
      default_type text/plain;
      return 200 "ok\n";
    }

    location = /stub_status {
      stub_status;
    }

    location / {
      return 404;
    }
  }
}
