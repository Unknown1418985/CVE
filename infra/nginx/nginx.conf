# Reverse proxy in front of the web frontend and the API Gateway.
# TLS termination is added in Phase 10 (production hardening); this configuration serves HTTP
# for local development only.
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  server_tokens off;
  client_max_body_size 1m;
  proxy_read_timeout 60s;

  # Basic per-IP limit in front of the gateway's own application-level rate limiting.
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

  upstream web {
    server web:3000;
  }

  upstream api_gateway {
    server api-gateway:4000;
  }

  server {
    listen 8080;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location /api/v1/ {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://api_gateway;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://web;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
