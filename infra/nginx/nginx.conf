# Reverse proxy in front of the web frontend, the API Gateway and Keycloak.
# Runs unprivileged (uid 101) with a read-only root filesystem; all temporary files go to /tmp.
# Local and development entry point: plain HTTP on 127.0.0.1 only. Production uses nginx.tls.conf
# (compose.prod.yaml), which terminates TLS and redirects HTTP to HTTPS.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  log_format json escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
    '"request_id":"$request_id","method":"$request_method","uri":"$uri","status":$status,'
    '"bytes_sent":$body_bytes_sent,"request_time":$request_time,'
    '"upstream":"$upstream_addr","upstream_time":"$upstream_response_time",'
    '"user_agent":"$http_user_agent"}';
  access_log /dev/stdout json;

  server_tokens off;
  sendfile on;
  keepalive_timeout 30s;
  client_max_body_size 1m;
  client_body_timeout 15s;
  client_header_timeout 15s;
  send_timeout 30s;
  proxy_connect_timeout 5s;
  proxy_read_timeout 60s;
  proxy_send_timeout 60s;

  # Per-IP limits in front of the gateway's own application-level rate limiting.
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
  limit_conn_zone $binary_remote_addr zone=perip:10m;
  limit_req_status 429;
  limit_conn_status 429;

  # Port clients connected to (forwarded to Keycloak and the web app).
  map $server_port $public_port {
    default $server_port;
  }

  # Propagate an existing correlation ID or use Nginx's request ID.
  map $http_x_correlation_id $correlation_id {
    default $http_x_correlation_id;
    '' $request_id;
  }

  upstream web {
    server web:3000;
    keepalive 16;
  }

  upstream api_gateway {
    server api-gateway:4000;
    keepalive 16;
  }

  upstream keycloak {
    server keycloak:8180;
    keepalive 8;
  }

  server {
    listen 8080;
    server_name _;
    include /etc/nginx/platform/snippets/platform.conf;
  }

  # Internal listener for health checks and the Prometheus exporter. Not published.
  server {
    listen 8081;
    access_log off;

    location = /healthz {
      default_type text/plain;
      return 200 "ok\n";
    }

    location = /stub_status {
      stub_status;
    }

    location / {
      return 404;
    }
  }
}
