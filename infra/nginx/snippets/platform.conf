# Shared server-level configuration for the platform virtual host: limits, security headers,
# proxy headers and routes. Included by nginx.conf (HTTP, local) and nginx.tls.conf (production).
limit_conn perip 50;

# Upstreams set some of these too; hide theirs so each header is sent exactly once.
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Cross-Origin-Opener-Policy;
proxy_hide_header X-Powered-By;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $public_port;
proxy_set_header X-Correlation-Id $correlation_id;

location /api/v1/ {
  limit_req zone=api burst=40 nodelay;
  proxy_pass http://api_gateway;
}

# Keycloak: only the public realm endpoints and static resources are proxied.
# The admin console and admin REST API are not reachable through Nginx.
location /auth/realms/ {
  limit_req zone=auth burst=20 nodelay;
  proxy_buffer_size 128k;
  proxy_buffers 4 256k;
  proxy_busy_buffers_size 256k;
  proxy_pass http://keycloak;
}

location /auth/resources/ {
  proxy_pass http://keycloak;
}

location /auth/js/ {
  proxy_pass http://keycloak;
}

location /auth/ {
  return 404;
}

location / {
  proxy_pass http://web;
}
